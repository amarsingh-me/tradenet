server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-API, non-file path serves index.html so client-side routing (if ever
    # added) and hard refreshes both work.
    location / {
        try_files $uri /index.html;
    }

    # Upgrades the connection to a raw WebSocket tunnel rather than proxying a buffered HTTP
    # response -- Upgrade/Connection: upgrade are what actually trigger the 101 handshake at the
    # backend; without them this would just proxy the initial GET as a normal request and the
    # upgrade would fail. proxy_read_timeout is kept long for the same reason the old SSE block
    # needed it: nginx's default (60s) would otherwise kill this long-lived connection on its own.
    location /ws/chat {
        proxy_pass http://backend:8080/ws/chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
