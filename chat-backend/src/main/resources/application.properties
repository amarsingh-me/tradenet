spring.application.name=chat-backend

# File-mode H2 so message/user history survives container restarts. AUTO_SERVER=TRUE
# lets the H2 console (if opened) attach to the same file without locking out the app.
# The path is under /data so it lines up with the Docker volume mount in docker-compose.yml;
# locally (no volume) it just creates ./data/chat.mv.db relative to the working directory.
spring.datasource.url=jdbc:h2:file:${CHAT_DB_PATH:./data/chat};AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update (not validate/create-drop): fine for an MVP with two tables, keeps restarts painless
# without needing a migration tool (Flyway/Liquibase) for a schema this small.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Each inbound HTTP request and WebSocket frame dispatch gets its own cheap virtual thread instead
# of contending for Tomcat's small platform-thread pool (default ~200). Safe with the synchronized
# persist lock in MessageDispatchService: JEP 491 (JDK 24+) removed the old carrier-pinning-on-
# synchronized concern, and this project targets Java 25. Headroom, not backpressure -- see
# MessageDispatchService's admission-control semaphore for the explicit reject-on-overload signal.
spring.threads.virtual.enabled=true
