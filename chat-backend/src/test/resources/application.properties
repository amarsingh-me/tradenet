# Tests use an in-memory H2 instead of the file-mode DB from src/main/resources: repeated test
# runs must not accumulate data in (or lock) the same file the app uses for real, and in-memory
# is faster to start up for every @SpringBootTest context.
spring.datasource.url=jdbc:h2:mem:chat-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# The SSE integration test leaves long-lived /api/events connections open by design (SseEmitter
# has no timeout in production, see SseConnectionRegistry). Without this, context shutdown after
# that test waits the full 30s default for those connections to be recognized as closed.
spring.lifecycle.timeout-per-shutdown-phase=3s
